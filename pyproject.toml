[project]
name = "coursepilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Khiem Nguyen", email = "knguy3n05@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
coursepilot = "coursepilot.cli:app"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
